<!doctype html><html><head><meta charset="utf-8"><title>Mini Risk</title>
<style>body{font:16px system-ui;margin:0;background:#f7f7f5;color:#0f172a}header{background:#4f46e5;color:#fff;padding:16px 32px;font-size:22px}
main{padding:32px}table{border-collapse:collapse;width:100%;background:#fff}td,th{padding:12px;border-bottom:1px solid #e5e7eb;text-align:left}
.high{color:#ef4444;font-weight:700}.low{color:#16a34a}button{padding:10px 18px;background:#4f46e5;color:#fff;border:0;border-radius:8px;font-size:15px}
input{padding:10px;font-size:15px;width:320px;border:1px solid #cbd5e1;border-radius:8px}.row{display:flex;gap:12px;margin-bottom:24px}</style></head>
<body><header>Mini Risk Dashboard</header><main><div class="row"><input id="q" placeholder="Search projects" aria-label="Search"><button id="go">Search</button><button id="del">Delete project</button><a href="report.html">Open report</a></div>
<table><thead><tr><th>Project</th><th>State</th><th>Delay (days)</th><th>Risk</th></tr></thead><tbody id="rows"></tbody></table></main>
<script>
const data=[["Road repair Ward 4","Maharashtra",210],["School roof","Kerala",12],["Water tank","Bihar",380],["Library","Punjab",45],["Clinic extension","Odisha",160],["Bus shelter","Goa",5]];
const risk=d=>Math.round(Math.min(d/365,1)*100);
function render(f=""){rows.innerHTML=data.filter(r=>r[0].toLowerCase().includes(f)).map(r=>{const s=risk(r[2]);return `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td class="${s>50?'high':'low'}">${s} ${s>50?'High':'Low'}</td></tr>`}).join("")}
render();go.onclick=()=>render(q.value.toLowerCase());del.onclick=()=>{data.shift();render();};
for(let i=0;i<30;i++)data.push(["Project "+i,"State "+i,(i*37)%400]);render();
</script></body></html>
