<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>unveo studio</title>
<style>
  :root { --bg: #f6f6f3; --card: #fff; --ink: #1c1c1e; --muted: #6b6b70; --line: #e4e4df; --accent: #2f5bea; --good: #1f8a4c; --rec: #d93a3a; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  main { max-width: 980px; margin: 0 auto; padding: 32px 20px 64px; display: grid; grid-template-columns: 1fr 280px; gap: 28px; }
  h1 { font-size: 18px; margin: 0 0 4px; } .sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
  .prompter { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 36px; min-height: 260px; }
  .tag { font: 600 12px ui-monospace, monospace; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
  .read { font-size: 34px; line-height: 1.35; font-weight: 600; margin: 14px 0 0; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; align-items: center; }
  button { font: 600 15px system-ui, sans-serif; padding: 11px 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.rec { background: var(--rec); border-color: var(--rec); color: #fff; }
  button.ok { background: var(--good); border-color: var(--good); color: #fff; }
  .status { color: var(--muted); font-size: 14px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--rec); margin-right: 6px; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  ol { list-style: none; padding: 0; margin: 0; }
  li { padding: 10px 12px; border-radius: 10px; cursor: pointer; font-size: 14px; color: var(--muted); border: 1px solid transparent; }
  li.current { background: var(--card); border-color: var(--line); color: var(--ink); }
  li .s { font: 600 11px ui-monospace, monospace; margin-right: 6px; }
  li.done .s::after { content: " ✓"; color: var(--good); }
  .progress { margin: 0 0 12px; font-size: 14px; color: var(--muted); }
  .tips { margin-top: 18px; font-size: 13px; color: var(--muted); }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <section>
    <h1>Record your own voice</h1>
    <p class="sub">Read the highlighted line, listen back, re-record if you like, then approve. Speak like you'd explain it to a friend.</p>
    <div class="prompter">
      <div class="tag" id="tag"></div>
      <p class="read" id="read">Loading…</p>
      <div class="controls">
        <button class="rec" id="record">● Record</button>
        <button id="play" disabled>▶ Play</button>
        <button id="approve" class="ok" disabled>Approve</button>
        <span class="status" id="status"></span>
      </div>
      <audio id="audio" hidden></audio>
    </div>
    <p class="tips">Keys: <b>R</b> record or stop · <b>P</b> play · <b>A</b> approve. Use a quiet room and keep a hand's width from the mic.</p>
  </section>
  <aside>
    <p class="progress" id="progress"></p>
    <ol id="list"></ol>
    <p style="margin-top:16px"><button class="primary" id="finish">Finish</button></p>
  </aside>
</main>
<script>
let lines = [], i = 0, rec = null, chunks = [], blob = null, stream = null;
const $ = id => document.getElementById(id);
async function load() {
  lines = await (await fetch('/lines')).json();
  const next = lines.findIndex(l => !l.approved);
  i = next < 0 ? 0 : next;
  render();
}
function render() {
  const l = lines[i];
  $('tag').textContent = l ? `${l.id} · ${l.segment}` : '';
  $('read').textContent = l ? l.text : 'No lines to read.';
  const n = lines.filter(x => x.approved).length;
  $('progress').textContent = `${n} of ${lines.length} approved`;
  $('list').innerHTML = lines.map((x, k) => `<li class="${k === i ? 'current' : ''} ${x.approved ? 'done' : ''}" data-k="${k}"><span class="s">${x.id}</span>${x.text}</li>`).join('');
  [...$('list').children].forEach(li => li.onclick = () => { i = +li.dataset.k; blob = null; reset(); render(); });
}
function reset() { $('play').disabled = true; $('approve').disabled = true; $('status').textContent = ''; $('record').textContent = '● Record'; }
async function toggleRecord() {
  if (rec && rec.state === 'recording') { rec.stop(); return; }
  stream = stream || await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  chunks = [];
  rec = new MediaRecorder(stream, { mimeType: MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '' });
  rec.ondataavailable = e => chunks.push(e.data);
  rec.onstop = () => {
    blob = new Blob(chunks, { type: rec.mimeType || 'audio/webm' });
    $('audio').src = URL.createObjectURL(blob);
    $('play').disabled = false; $('approve').disabled = false;
    $('record').textContent = '● Re-record';
    $('status').textContent = 'Listen back. Happy? Approve. Not quite? Re-record.';
  };
  rec.start();
  $('record').textContent = '■ Stop'; $('play').disabled = true; $('approve').disabled = true;
  $('status').innerHTML = '<span class="dot"></span>Recording…';
}
async function approve() {
  if (!blob) return;
  $('status').textContent = 'Saving…';
  const r = await fetch(`/take/${lines[i].id}`, { method: 'POST', body: blob });
  if (!(await r.json()).ok) { $('status').textContent = 'Could not save. Try again.'; return; }
  lines[i].approved = true; blob = null;
  const next = lines.findIndex(l => !l.approved);
  if (next >= 0) i = next;
  reset(); render();
  if (next < 0) $('status').textContent = 'All lines approved. Press Finish.';
}
$('record').onclick = toggleRecord;
$('play').onclick = () => $('audio').play();
$('approve').onclick = approve;
$('finish').onclick = async () => { await fetch('/finish', { method: 'POST' }); document.body.innerHTML = '<main><h1>Saved. You can close this tab.</h1></main>'; };
addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') toggleRecord();
  if ((e.key === 'p' || e.key === 'P') && !$('play').disabled) $('audio').play();
  if ((e.key === 'a' || e.key === 'A') && !$('approve').disabled) approve();
});
load();
</script>
</body>
</html>
