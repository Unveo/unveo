<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>unveo studio</title>
<link rel="icon" href="/favicon.png">
<style>
  :root { --paper: #fbfaf5; --card: #ffffff; --ink: #111111; --muted: #77776f; --faint: #b9b8ae; --line: #e7e5da;
          --brand: #fdfa8d; --rec: #e5484d; --good: #1f8a4c; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); }
  header { display: flex; align-items: center; gap: 12px; padding: 18px 28px; border-bottom: 1px solid var(--line); }
  header img { width: 34px; height: 34px; border-radius: 8px; }
  header .name { font-weight: 700; letter-spacing: -.01em; }
  header .name span { color: var(--muted); font-weight: 500; }
  header .progress { margin-left: auto; color: var(--muted); font-size: 14px; }
  main { max-width: 1040px; margin: 0 auto; padding: 28px 20px 64px; display: grid; grid-template-columns: 1fr 270px; gap: 28px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 34px 38px 28px; }
  .tag { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; display: flex; gap: 14px; }
  #read { font-size: 36px; line-height: 1.45; font-weight: 600; letter-spacing: -.01em; margin: 18px 0 6px; min-height: 2.9em; }
  #read .w { padding: 0 .08em; margin: 0 -.02em; border-radius: 4px; transition: color .15s, background-color .15s; }
  .live #read .w.said { color: var(--faint); }
  .live #read .w.now { color: var(--ink); background: var(--brand); }
  #read .w.pace { text-decoration: underline 3px var(--faint); text-underline-offset: 8px; }
  .next { color: var(--muted); font-size: 15px; margin-top: 14px; min-height: 1.5em; }
  .next b { font-weight: 600; color: var(--faint); font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .06em; margin-right: 6px; }
  .meter { display: flex; align-items: baseline; gap: 14px; margin-top: 20px; font-variant-numeric: tabular-nums; }
  #clock { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  #pacenote { font-size: 14px; color: var(--muted); }
  #pacenote.behind { color: var(--rec); } #pacenote.ok { color: var(--good); }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; align-items: center; }
  button { font: 600 15px system-ui, sans-serif; padding: 11px 18px; border-radius: 11px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  button.rec { background: var(--ink); border-color: var(--ink); color: #fff; }
  button.rec.on { background: var(--rec); border-color: var(--rec); }
  button.ok { background: var(--brand); border-color: #e9e57a; }
  .status { color: var(--muted); font-size: 14px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--rec); margin-right: 6px; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  aside h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 4px 0 10px; text-transform: uppercase; letter-spacing: .06em; }
  ol { list-style: none; padding: 0; margin: 0; }
  li { padding: 9px 11px; border-radius: 10px; cursor: pointer; font-size: 14px; color: var(--muted); border: 1px solid transparent; }
  li .t { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  li.current { background: var(--card); border-color: var(--line); color: var(--ink); }
  li .s { font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; margin-right: 6px; }
  li.done .s::after { content: " ✓"; color: var(--good); }
  #finish { width: 100%; margin-top: 16px; }
  .tips { margin-top: 18px; font-size: 13px; color: var(--muted); }
  .tips kbd { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; background: var(--card); }
  @media (max-width: 780px) { main { grid-template-columns: 1fr; } #read { font-size: 28px; } }
</style>
</head>
<body>
<header>
  <img src="/logo.png" alt="">
  <div class="name">unveo <span>studio</span></div>
  <div class="progress" id="progress"></div>
</header>
<main>
  <section>
    <div class="card" id="card">
      <div class="tag"><span id="tag"></span><span id="target"></span></div>
      <p id="read">Loading…</p>
      <div class="meter"><span id="clock">0.0 s</span><span id="pacenote"></span></div>
      <div class="controls">
        <button class="rec" id="record">● Record</button>
        <button id="play" disabled>▶ Play</button>
        <button id="approve" class="ok" disabled>Approve</button>
        <span class="status" id="status"></span>
      </div>
      <audio id="audio" hidden></audio>
    </div>
    <p class="next" id="next"></p>
    <p class="tips"><kbd>R</kbd> record / stop · <kbd>P</kbd> play · <kbd>A</kbd> approve. Read at the pace of the underline; the yellow follows your voice<span id="mode"></span>. Speak like you're showing a friend. A quiet room, a hand's width from the mic.</p>
  </section>
  <aside>
    <h2>Lines</h2>
    <ol id="list"></ol>
    <button id="finish">Finish</button>
  </aside>
</main>
<script>
const $ = id => document.getElementById(id);
const norm = w => w.toLowerCase().replace(/[^\p{L}\p{N}]/gu, '');
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let lines = [], i = 0, rec = null, chunks = [], blob = null, stream = null;
let t0 = 0, timer = null, heardAt = [], heardPtr = 0, recog = null, recogOn = !!SR, lastHeard = 0, took = 0;

async function load() {
  lines = await (await fetch('/lines')).json();
  const next = lines.findIndex(l => !l.approved);
  i = next < 0 ? 0 : next;
  render();
}
const words = () => (lines[i] ? lines[i].text.split(/\s+/) : []);
function render() {
  const l = lines[i];
  $('tag').textContent = l ? `${l.id} · ${l.segment}` : '';
  $('target').textContent = l ? `target ${l.target_s.toFixed(1)} s` : '';
  $('read').innerHTML = l ? words().map((w, k) => `<span class="w" data-k="${k}">${w.replace(/[<&]/g, c => c === '<' ? '&lt;' : '&amp;')}</span>`).join(' ') : 'No lines to read.';
  const after = lines[i + 1];
  $('next').innerHTML = after ? `<b>NEXT</b>${after.text}` : '';
  const n = lines.filter(x => x.approved).length;
  $('progress').textContent = `${n} of ${lines.length} approved`;
  $('list').innerHTML = lines.map((x, k) => `<li class="${k === i ? 'current' : ''} ${x.approved ? 'done' : ''}" data-k="${k}"><div class="t"><span class="s">${x.id}</span>${x.text}</div></li>`).join('');
  [...$('list').children].forEach(li => li.onclick = () => { if (rec && rec.state === 'recording') return; i = +li.dataset.k; blob = null; reset(); render(); });
  $('mode').textContent = recogOn ? '' : ' (this browser has no speech recognition, so here it follows the pace)';
}
function reset() {
  $('play').disabled = true; $('approve').disabled = true; $('status').textContent = '';
  $('record').textContent = '● Record'; $('clock').textContent = '0.0 s'; $('pacenote').textContent = ''; $('pacenote').className = '';
  $('card').classList.remove('live');
}

// --- the highlight: the word being said (speech recognition), and where the pace says you should be
function paint() {
  const l = lines[i], el = (performance.now() - t0) / 1000;
  const n = words().length, pace = Math.floor(Math.max(0, el - 0.25) * l.wps);
  const now = recogOn && heardPtr > 0 ? heardPtr - 1 : Math.min(pace, n - 1);  // until your voice is heard, the pace leads
  [...$('read').children].forEach((s, k) => {
    s.classList.toggle('paced', k < pace);
    s.classList.toggle('pace', k === pace && pace < n);
    s.classList.toggle('said', k < now);
    s.classList.toggle('now', k === now);
  });
  $('clock').textContent = `${el.toFixed(1)} s / ${l.target_s.toFixed(1)} s`;
  if (recogOn && heardPtr > 0) {
    const behind = (Math.min(pace, n) - heardPtr) / l.wps;
    const note = $('pacenote');
    note.textContent = behind > 0.6 ? `${behind.toFixed(1)} s behind the pace` : behind < -0.8 ? 'ahead of the pace' : 'on pace';
    note.className = behind > 0.6 ? 'behind' : 'ok';
  }
  if (recogOn && heardPtr >= n && performance.now() - lastHeard > 600) toggleRecord();  // auto-stop after the last word
}
function match(transcript) {
  const ws = words().map(norm), now = (performance.now() - t0) / 1000;
  let p = 0;
  for (const h of transcript.split(/\s+/).map(norm).filter(Boolean)) {
    for (let j = p; j < Math.min(ws.length, p + 4); j++) {
      const a = ws[j];
      if (a === h || (a.length >= 4 && h.length >= 4 && a.slice(0, 4) === h.slice(0, 4))) {
        if (heardAt[j] == null) { heardAt[j] = now; lastHeard = performance.now(); }
        p = j + 1; break;
      }
    }
  }
  heardPtr = Math.max(heardPtr, p);
}
function startRecognition() {
  if (!recogOn) return;
  let committed = '';
  recog = new SR();
  recog.continuous = true; recog.interimResults = true; recog.lang = lines[i].lang === 'hi' ? 'hi-IN' : (navigator.language.startsWith('en') ? navigator.language : 'en-US');
  recog.onresult = e => { let s = ''; for (const r of e.results) s += r[0].transcript + ' '; match(committed + ' ' + s); recog._last = s; };
  recog.onerror = e => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed' || e.error === 'network') { recogOn = false; render(); } };
  recog.onend = () => { committed += ' ' + (recog._last || ''); recog._last = ''; if (rec && rec.state === 'recording' && recogOn) try { recog.start(); } catch (_) {} };
  try { recog.start(); } catch (_) { recogOn = false; }
}

async function toggleRecord() {
  if (rec && rec.state === 'recording') {
    rec.stop(); clearInterval(timer); took = (performance.now() - t0) / 1000;
    if (recog) { const r = recog; recog = null; r.onend = null; try { r.stop(); } catch (_) {} }
    return;
  }
  try {
    stream = stream || await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  } catch (_) { $('status').textContent = 'The microphone is blocked. Allow it in the address bar, then press Record again.'; return; }
  chunks = []; heardAt = []; heardPtr = 0; blob = null;
  rec = new MediaRecorder(stream, { mimeType: MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '' });
  rec.ondataavailable = e => chunks.push(e.data);
  rec.onstop = () => {
    blob = new Blob(chunks, { type: rec.mimeType || 'audio/webm' });
    $('audio').src = URL.createObjectURL(blob);
    $('play').disabled = false; $('approve').disabled = false;
    $('record').textContent = '● Re-record'; $('record').classList.remove('on');
    const l = lines[i], over = took - l.target_s;
    $('status').textContent = over > Math.max(1, l.target_s * 0.15)
      ? `${took.toFixed(1)} s, ${over.toFixed(1)} s slower than the pace. Re-record a little quicker, or approve if it feels right.`
      : `${took.toFixed(1)} s · target ${l.target_s.toFixed(1)} s ✓ Listen back, then approve.`;
  };
  rec.onstart = () => { t0 = performance.now(); timer = setInterval(paint, 50); startRecognition(); };
  rec.start();
  $('card').classList.add('live');
  $('record').textContent = '■ Stop'; $('record').classList.add('on'); $('play').disabled = true; $('approve').disabled = true;
  $('status').innerHTML = '<span class="dot"></span>Recording';
}
async function approve() {
  if (!blob) return;
  $('status').textContent = 'Saving…';
  const id = lines[i].id;
  const r = await fetch(`/take/${id}`, { method: 'POST', body: blob });
  if (!(await r.json()).ok) { $('status').textContent = 'Could not save. Try again.'; return; }
  await fetch(`/words/${id}`, { method: 'POST', body: JSON.stringify({ words: words().map((w, k) => ({ w, t: heardAt[k] ?? null })) }) });
  lines[i].approved = true; blob = null;
  const next = lines.findIndex(l => !l.approved);
  if (next >= 0) i = next;
  reset(); render();
  if (next < 0) $('status').textContent = 'All lines approved. Press Finish.';
}
$('record').onclick = toggleRecord;
$('play').onclick = () => $('audio').play();
$('approve').onclick = approve;
$('finish').onclick = async () => {
  await fetch('/finish', { method: 'POST' });
  document.body.innerHTML = '<header><img src="/logo.png" alt=""><div class="name">unveo <span>studio</span></div></header><main><h1 style="font-size:22px">Saved. You can close this tab.</h1></main>';
};
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'r' || e.key === 'R') toggleRecord();
  if ((e.key === 'p' || e.key === 'P') && !$('play').disabled) $('audio').play();
  if ((e.key === 'a' || e.key === 'A') && !$('approve').disabled) approve();
});
load();
</script>
</body>
</html>
