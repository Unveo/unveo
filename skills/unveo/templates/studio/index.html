<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>unveo studio</title>
<link rel="icon" href="/favicon.png">
<style>
  :root {
    --yellow: #fdfa8d; --ink: #111111; --paper: #fffef3; --rec: #e5484d;
    --ink-60: rgba(17, 17, 17, .6); --ink-35: rgba(17, 17, 17, .35); --ink-15: rgba(17, 17, 17, .15);
    --display: "SF Pro Display", -apple-system, "Segoe UI Variable Display", "Segoe UI", Roboto, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--yellow); color: var(--ink); font: 17px/1.45 var(--display); font-variant-numeric: tabular-nums;
         display: grid; grid-template-rows: auto 1fr auto; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; border-radius: 10px; }

  /* top: the mark, the slash rail (one slash per line), finish */
  .top { display: flex; align-items: center; gap: 18px; padding: 18px clamp(16px, 4vw, 44px); }
  .top img { width: 40px; height: 40px; border-radius: 9px; border: 2px solid var(--ink); }
  .top .name { font-weight: 800; letter-spacing: -.02em; font-size: 19px; }
  .rail { margin-left: auto; display: flex; align-items: center; gap: 2px; }
  .rail button { background: none; border: 0; padding: 2px 3px; font: 900 26px/1 var(--display); color: var(--ink-15); }
  .rail button.done { color: var(--ink); }
  .rail button.here { color: var(--ink); text-decoration: underline 3px; text-underline-offset: 7px; }
  .count { font-weight: 650; margin-left: 10px; white-space: nowrap; }
  .finish { background: var(--ink); color: var(--yellow); border: 0; border-radius: 999px; padding: 9px 18px; font-weight: 750; margin-left: 8px; }
  .finish:disabled { background: var(--ink-15); color: var(--ink-60); cursor: default; }

  /* the stage: one line, huge */
  .stage { display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 8px clamp(16px, 5vw, 64px); min-height: 0; }
  .where { font-weight: 650; color: var(--ink-60); margin-bottom: 14px; }
  .hint { max-width: 40ch; text-align: center; background: var(--paper); border: 2px solid var(--ink); border-radius: 14px;
          padding: 10px 16px; margin: 0 0 26px; font-weight: 550; }
  .hint[hidden] { display: none; }
  #read { margin: 0; max-width: 24ch; text-align: center; font: 800 clamp(30px, 4.6vw, 64px)/1.16 var(--display); letter-spacing: -.035em;
          text-wrap: balance; }
  #read .w { border-radius: .14em; padding: 0 .06em; margin: 0 -.03em; transition: color .18s ease, background-color .12s ease; }
  #read .w.said { color: var(--ink-35); }
  #read .w.now { background: var(--ink); color: var(--yellow); }
  .next { margin: 28px 0 0; max-width: 60ch; text-align: center; background: var(--paper); border-radius: 12px; padding: 10px 16px;
          color: var(--ink-60); font-size: 16px; }
  .next b { color: var(--ink); font-weight: 700; margin-right: 6px; }
  .next:empty { display: none; }

  /* bottom: pace bar, then the controls */
  .deck { padding: 0 clamp(16px, 5vw, 64px) 26px; max-width: 980px; width: 100%; margin: 0 auto; }
  .pace { position: relative; height: 14px; background: var(--ink-15); border-radius: 999px; }
  #pacefill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--ink); border-radius: 999px; }
  #you { position: absolute; top: 50%; left: 0; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%;
         background: var(--yellow); border: 3px solid var(--ink); display: none; }
  .heard #you { display: block; }  /* only once the browser can hear you: then it's where you are vs the fill */
  .meter { display: flex; justify-content: space-between; margin-top: 9px; font-weight: 650; }
  #pacenote.behind { color: var(--rec); }
  .controls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 18px; margin-top: 18px; }
  .side { border: 2px solid var(--ink); background: transparent; border-radius: 999px; padding: 12px 22px; font-weight: 750; }
  .side:disabled { border-color: var(--ink-15); color: var(--ink-35); cursor: default; }
  #play { justify-self: end; }
  #approve { justify-self: start; background: var(--ink); color: var(--yellow); border-color: var(--ink); }
  #approve:disabled { background: transparent; color: var(--ink-35); border-color: var(--ink-15); }
  #record { width: 96px; height: 96px; border-radius: 50%; border: 0; background: var(--ink); display: grid; place-items: center;
            box-shadow: 0 0 0 6px var(--yellow), 0 0 0 9px var(--ink); }
  #record .dot { width: 34px; height: 34px; border-radius: 50%; background: var(--rec); transition: border-radius .2s ease, width .2s, height .2s; }
  #record.on .dot { width: 30px; height: 30px; border-radius: 6px; }
  #record.on { animation: breathe 1.6s ease-in-out infinite; }
  @keyframes breathe { 50% { box-shadow: 0 0 0 6px var(--yellow), 0 0 0 13px var(--rec); } }
  .status { text-align: center; margin-top: 12px; min-height: 1.5em; font-weight: 600; }
  .keys { text-align: center; color: var(--ink-60); font-size: 14px; margin-top: 4px; }
  kbd { font: 700 13px var(--display); border: 1.5px solid var(--ink-35); border-radius: 6px; padding: 0 6px; }

  .done-screen { text-align: center; }
  .done-screen h1 { font: 800 clamp(34px, 5vw, 64px)/1.1 var(--display); letter-spacing: -.03em; margin: 0 0 12px; }

  @media (max-width: 640px) {
    .rail button { font-size: 20px; padding: 2px 1px; }
    .count, .keys { display: none; }
    #record { width: 78px; height: 78px; }
    .side { padding: 10px 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<header class="top">
  <img src="/logo.png" alt="unveo">
  <span class="name">studio</span>
  <nav class="rail" id="rail" aria-label="Lines"></nav>
  <span class="count" id="progress"></span>
  <button class="finish" id="finish" disabled>Finish</button>
</header>

<main class="stage" id="stage">
  <div class="where" id="where"></div>
  <p class="hint" id="hint" hidden>Read the line out loud. The black box follows your voice, and the bar shows how fast to go.</p>
  <p id="read">Loading your lines…</p>
  <p class="next" id="next"></p>
</main>

<footer class="deck" id="deck">
  <div class="pace" aria-hidden="true"><div id="pacefill"></div><div id="you"></div></div>
  <div class="meter"><span id="clock">0.0 s of 0.0 s</span><span id="pacenote"></span></div>
  <div class="controls">
    <button class="side" id="play" disabled>Play</button>
    <button id="record" aria-label="Record"><span class="dot"></span></button>
    <button class="side" id="approve" disabled>Approve</button>
  </div>
  <div class="status" id="status" role="status"></div>
  <div class="keys"><kbd>R</kbd> record or stop &nbsp; <kbd>P</kbd> play &nbsp; <kbd>A</kbd> approve</div>
  <audio id="audio" hidden></audio>
</footer>

<script>
const $ = id => document.getElementById(id);
const norm = w => w.toLowerCase().replace(/[^\p{L}\p{N}]/gu, '');
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let lines = [], i = 0, rec = null, chunks = [], blob = null, stream = null;
let t0 = 0, timer = null, heardAt = [], heardPtr = 0, recog = null, recogOn = !!SR, lastHeard = 0, took = 0;
const store = { get: k => { try { return localStorage.getItem(k); } catch (_) { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} } };

async function load() {
  lines = await (await fetch('/lines')).json();
  const next = lines.findIndex(l => !l.approved);
  i = next < 0 ? 0 : next;
  $('hint').hidden = !!store.get('unveo-studio-hint');
  render();
}
const words = () => (lines[i] ? lines[i].text.split(/\s+/) : []);
const recording = () => rec && rec.state === 'recording';

function render() {
  const l = lines[i];
  const n = lines.filter(x => x.approved).length;
  $('progress').textContent = `${n} of ${lines.length} recorded`;
  $('finish').disabled = n < lines.length;
  $('rail').innerHTML = lines.map((x, k) =>
    `<button class="${x.approved ? 'done' : ''} ${k === i ? 'here' : ''}" data-k="${k}" aria-label="Line ${k + 1}${x.approved ? ', recorded' : ''}">/</button>`).join('');
  [...$('rail').children].forEach(b => b.onclick = () => { if (recording()) return; i = +b.dataset.k; blob = null; reset(); render(); });
  if (!l) { $('read').textContent = 'There are no lines to read.'; return; }
  $('where').textContent = `Line ${i + 1} of ${lines.length}`;
  $('read').innerHTML = words().map((w, k) => `<span class="w" data-k="${k}">${w.replace(/[<&]/g, c => c === '<' ? '&lt;' : '&amp;')}</span>`).join(' ');
  const after = lines[i + 1];
  $('next').innerHTML = after ? `<b>Next</b>${after.text.replace(/[<&]/g, '')}` : '';
  $('clock').textContent = `0.0 s of ${l.target_s.toFixed(1)} s`;
}
function reset() {
  $('play').disabled = true; $('approve').disabled = true; $('status').textContent = '';
  $('record').setAttribute('aria-label', 'Record'); $('pacenote').textContent = ''; $('pacenote').className = '';
  $('pacefill').style.width = '0'; $('deck').classList.remove('live', 'heard');
  if (lines[i]) $('clock').textContent = `0.0 s of ${lines[i].target_s.toFixed(1)} s`;
}

// one indicator: the black box is the word you're on (your voice; the pace when the browser can't hear)
function paint() {
  const l = lines[i], el = (performance.now() - t0) / 1000, n = words().length;
  const paced = Math.min(n, Math.max(0, el - 0.25) * l.wps);
  const heard = recogOn && heardPtr > 0;  // until the browser hears you, the box keeps the pace
  const you = heard ? heardPtr : Math.floor(paced);
  const now = heard ? heardPtr - 1 : Math.min(Math.floor(paced), n - 1);
  [...$('read').children].forEach((s, k) => { s.classList.toggle('said', k < now); s.classList.toggle('now', k === now); });
  $('pacefill').style.width = `${Math.min(100, (el / l.target_s) * 100)}%`;
  $('you').style.left = `${(you / n) * 100}%`;
  $('deck').classList.toggle('heard', heard);
  $('clock').textContent = `${el.toFixed(1)} s of ${l.target_s.toFixed(1)} s`;
  if (recogOn && heardPtr > 0) {
    const behind = (paced - heardPtr) / l.wps;
    $('pacenote').textContent = behind > 0.6 ? 'A bit quicker' : behind < -0.8 ? 'Slow down a little' : 'On pace';
    $('pacenote').className = behind > 0.6 ? 'behind' : '';
  }
  if (recogOn && heardPtr >= n && performance.now() - lastHeard > 600) toggleRecord();  // stops by itself after the last word
}
function match(transcript) {
  const ws = words().map(norm), now = (performance.now() - t0) / 1000;
  let p = 0;
  for (const h of transcript.split(/\s+/).map(norm).filter(Boolean)) {
    for (let j = p; j < Math.min(ws.length, p + 4); j++) {
      const a = ws[j];
      if (a === h || (a.length >= 4 && h.length >= 4 && a.slice(0, 4) === h.slice(0, 4))) {
        if (heardAt[j] == null) { heardAt[j] = now; lastHeard = performance.now(); }
        p = j + 1; break;
      }
    }
  }
  heardPtr = Math.max(heardPtr, p);
}
function startRecognition() {
  if (!recogOn) return;
  let committed = '';
  recog = new SR();
  recog.continuous = true; recog.interimResults = true;
  recog.lang = lines[i].lang === 'hi' ? 'hi-IN' : (navigator.language.startsWith('en') ? navigator.language : 'en-US');
  recog.onresult = e => { let s = ''; for (const r of e.results) s += r[0].transcript + ' '; match(committed + ' ' + s); recog._last = s; };
  recog.onerror = e => { if (['not-allowed', 'service-not-allowed', 'network'].includes(e.error)) recogOn = false; };
  recog.onend = () => { committed += ' ' + (recog._last || ''); recog._last = ''; if (recording() && recogOn) try { recog.start(); } catch (_) {} };
  try { recog.start(); } catch (_) { recogOn = false; }
}

async function toggleRecord() {
  if (recording()) {
    rec.stop(); clearInterval(timer); took = (performance.now() - t0) / 1000;
    if (recog) { const r = recog; recog = null; r.onend = null; try { r.stop(); } catch (_) {} }
    return;
  }
  try {
    stream = stream || await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  } catch (_) { $('status').textContent = 'The microphone is blocked. Allow it in the address bar, then press Record again.'; return; }
  store.set('unveo-studio-hint', '1'); $('hint').hidden = true;
  chunks = []; heardAt = []; heardPtr = 0; blob = null;
  rec = new MediaRecorder(stream, { mimeType: MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '' });
  rec.ondataavailable = e => chunks.push(e.data);
  rec.onstop = () => {
    blob = new Blob(chunks, { type: rec.mimeType || 'audio/webm' });
    $('audio').src = URL.createObjectURL(blob);
    $('play').disabled = false; $('approve').disabled = false;
    $('record').classList.remove('on'); $('record').setAttribute('aria-label', 'Record again');
    const l = lines[i], over = took - l.target_s;
    $('status').textContent = over > Math.max(1, l.target_s * 0.15)
      ? `That took ${took.toFixed(1)} s, ${over.toFixed(1)} s longer than the pace. Record again a little quicker, or approve it.`
      : `That took ${took.toFixed(1)} s, right on time. Play it back, then approve.`;
  };
  rec.onstart = () => { t0 = performance.now(); timer = setInterval(paint, 50); startRecognition(); };
  rec.start();
  $('deck').classList.add('live');
  $('record').classList.add('on'); $('record').setAttribute('aria-label', 'Stop');
  $('play').disabled = true; $('approve').disabled = true;
  $('status').textContent = 'Recording. Read the line; it stops by itself after the last word.';
}
async function approve() {
  if (!blob) return;
  $('status').textContent = 'Saving…';
  const id = lines[i].id;
  const r = await fetch(`/take/${id}`, { method: 'POST', body: blob });
  if (!(await r.json()).ok) { $('status').textContent = "Couldn't save this take. Press Approve again."; return; }
  await fetch(`/words/${id}`, { method: 'POST', body: JSON.stringify({ words: words().map((w, k) => ({ w, t: heardAt[k] ?? null })) }) });
  lines[i].approved = true; blob = null;
  const next = lines.findIndex(l => !l.approved);
  if (next >= 0) i = next;
  reset(); render();
  $('status').textContent = next < 0 ? 'Every line is recorded. Press Finish.' : 'Saved. Here is the next line.';
}
async function finish() {
  await fetch('/finish', { method: 'POST' });
  $('stage').innerHTML = '<div class="done-screen"><h1>All recorded.</h1><p>Your takes are saved. You can close this tab; unveo carries on.</p></div>';
  $('deck').remove();
}
$('record').onclick = toggleRecord;
$('play').onclick = () => $('audio').play();
$('approve').onclick = approve;
$('finish').onclick = finish;
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === 'r') { e.preventDefault(); toggleRecord(); }
  if (k === 'p' && !$('play').disabled) $('audio').play();
  if (k === 'a' && !$('approve').disabled) approve();
});
load();
</script>
</body>
</html>
